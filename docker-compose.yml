services:
  redis:
    image: redis:7.4-alpine
    container_name: redis-server
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --requirepass your_strong_password
    volumes:
      - redis_data:/data

  db:
    image: mysql:8.0
    container_name: mysql-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${ROOT_PASSWORD}   # root 계정 비밀번호 (필수)
      MYSQL_DATABASE: mydb    # 데이터베이스 이름 (선택)
      MYSQL_USER: ${SPRING_DATASOURCE_USERNAME}
      MYSQL_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      TZ: Asia/Seoul                     # 타임존 설정
    ports:
      - "3307:3307"                       # 외부접속포트:컨테이너포트
    command:
      --port=3307
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql         # 데이터 보존을 위한 볼륨 매핑
      # - ./init:/docker-entrypoint-initdb.d  # 초기 .sql 스크립트 실행 시 사용 (필요시 주석 해제)

  # (선택 사항) 웹 UI DB 관리 도구 (phpMyAdmin)
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin
    restart: always
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: ${ROOT_PASSWORD}
    depends_on:
      - db

volumes:
  redis_data:
  mysql_data: